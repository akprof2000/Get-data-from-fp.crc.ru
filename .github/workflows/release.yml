name: Release

# Релиз выпускается по тегу vX.Y.Z (или вручную с указанием версии).
# Собираются четыре архива — два варианта поставки × две платформы:
#   standalone — со встроенным .NET (ставить ничего не нужно)
#   compact    — приложения + библиотеки, нужен .NET 10 Runtime
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без префикса v (например 1.4.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Все приложения конвейера кладутся в ОДИН каталог поставки
  # (включая вспомогательные GetGarData и NormalizeAddress).
  PROJECTS: 'GetSiteData ParseHTML MLTextToData ParseTextHeader GetGarData NormalizeAddress'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]
        kind: [standalone, compact]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Определить версию
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация всех приложений в один каталог
        run: |
          out="publish/${{ matrix.kind }}-${{ matrix.rid }}"
          # standalone — самодостаточный один файл на приложение;
          # compact — обычная framework-dependent поставка с библиотеками рядом.
          if [ "${{ matrix.kind }}" = "standalone" ]; then
            extra="--self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true"
          else
            extra="--self-contained false"
          fi
          for p in $PROJECTS; do
            dotnet publish "GetSiteData/$p/$p.csproj" \
              -c Release -r ${{ matrix.rid }} $extra -o "$out"
          done
          # PDB в поставке не нужны и заметно её утяжеляют.
          find "$out" -name '*.pdb' -delete

      - name: Упаковать архив
        id: pack
        run: |
          v="${{ steps.ver.outputs.version }}"
          dir="publish/${{ matrix.kind }}-${{ matrix.rid }}"
          base="GetDataFpCrcRu-v$v-${{ matrix.kind }}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd "$dir" && zip -qr "../../dist/$base.zip" .)
            echo "asset=dist/$base.zip" >> "$GITHUB_OUTPUT"
          else
            # Исполняемые файлы Linux после кросс-публикации теряют бит +x.
            for p in $PROJECTS; do chmod +x "$dir/$p" 2>/dev/null || true; done
            chmod +x "$dir/run-pipeline.sh" 2>/dev/null || true
            tar czf "dist/$base.tar.gz" -C "$dir" .
            echo "asset=dist/$base.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kind }}-${{ matrix.rid }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужны вся история и теги: описание релиза собирается
      # из аннотации тега и списка коммитов с предыдущего тега.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Собрать описание релиза
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="v${{ github.event.inputs.version }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

          # Аннотация тега — основное описание релиза (что и зачем сделано).
          # --generate-notes здесь не годится: он строит «What's Changed» из
          # pull request'ов, а коммиты идут прямо в main, и раздел выходит пустым.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$tag" > notes.md

          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            echo
            echo '## Коммиты'
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$tag"
            else
              git log --no-merges --pretty='- %s' "$tag"
            fi
            echo
            if [ -n "$prev" ]; then
              echo "**Полный список изменений**: ${{ github.server_url }}/${{ github.repository }}/compare/$prev...$tag"
            fi
          } >> notes.md
          echo '--- notes.md ---'; cat notes.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Идемпотентно: повторный прогон по тому же тегу (например, после
          # перезаписи аннотации или перезапуска упавшего задания) не должен
          # падать на «release already exists» — просто обновляем существующий.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже существует — обновляем описание и файлы."
            gh release edit "$tag" --title "$tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes-file notes.md
          fi
